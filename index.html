<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | 極致智慧待辦清單</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    /* 支援瀏覽器深色模式日期時間選取器 */
    input[type="datetime-local"],
    input[type="date"] {
      color-scheme: dark;
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.8);
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover,
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Checkbox bounce animation */
    @keyframes checkBounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .check-animated {
      animation: checkBounce 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white antialiased">

  <!-- Top Header Navigation -->
  <header class="w-full border-b border-slate-800/80 bg-slate-900/70 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white text-xl">
          <i class="ph-fill ph-check-square-offset"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold tracking-tight text-white">TaskFlow</h1>
            <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">Pro</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block" id="currentDateDisplay">載入日期中...</p>
        </div>
      </div>

      <!-- Header Action Controls -->
      <div class="flex items-center space-x-2">
        <button id="quickStatsBtn" class="p-2 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition">
          <i class="ph-bold ph-chart-line-up text-indigo-400"></i>
          <span>概覽分析</span>
        </button>
        <button id="clearCompletedBtn" class="p-2 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-300 hover:text-rose-400 text-xs font-semibold flex items-center gap-1.5 transition" title="清除所有已完成的任務">
          <i class="ph-bold ph-broom"></i>
          <span class="hidden md:inline">清理已完成</span>
        </button>
        <button id="clearAllBtn" class="p-2 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-300 hover:text-rose-400 text-xs font-semibold flex items-center gap-1.5 transition" title="清空全部任務">
          <i class="ph-bold ph-trash"></i>
          <span class="hidden md:inline">全部清空</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">

    <!-- Progress & Motivation Card -->
    <div class="glass-card rounded-3xl p-5 md:p-6 relative overflow-hidden shadow-xl">
      <div class="absolute -right-16 -top-16 w-60 h-60 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
            <span>今日進度追蹤</span>
            <span class="text-xs font-normal px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700/60" id="productivityQuote">維持專注，按部就班</span>
          </h2>
          <p class="text-sm text-slate-400 mt-1">
            已完成 <span class="text-indigo-400 font-bold" id="statDoneCount">0</span> / <span class="font-bold text-slate-200" id="statTotalCount">0</span> 個待辦事項
          </p>
        </div>

        <!-- Progress Bar & Rate -->
        <div class="w-full md:w-72 flex flex-col gap-1.5">
          <div class="flex justify-between items-center text-xs font-semibold">
            <span class="text-slate-400">完成率</span>
            <span class="text-indigo-400 font-bold" id="statPercent">0%</span>

    <!-- Task Creation Form -->

      <form id="taskForm" class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">

              id="taskTitleInput" 
              placeholder="新增待辦任務... (例如：完成專案報告、買牛奶)" 
              class="w-full glass-input text-slate-100 placeholder-slate-500 px-4 py-3.5 rounded-2xl text-base focus:outline-none transition"
              required 
            />

        <!-- Advanced Options Toolbar -->

              <option value="study" class="bg-slate-900 text-slate-200">📚 學習進修</option>

              <option value="finance" class="bg-slate-900 text-slate-200">💳 財務理財</option>

        <button data-filter="all" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all bg-indigo-600 text-white shadow-sm">

        <button data-filter="completed" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all">
          已完成 (<span id="countFilterCompleted">0</span>)

      </div>

      <!-- Search & Sorting Filter -->

          <input

          <option value="work">💼 工作</option>
          <option value="study">📚 學習</option>
          <option value="personal">🏠 生活</option>
          <option value="finance">💳 財務</option>
          <option value="health">🏃 健康</option>
        </select>

        <!-- Sort Select -->
        <select id="sortByDropdown" class="glass-input text-xs text-slate-300 py-2 px-3 rounded-xl focus:outline-none font-medium cursor-pointer" title="排序方式">
          <option value="created-desc">建立時間 (新→舊)</option>
          <option value="created-asc">建立時間 (舊→新)</option>
          <option value="priority-desc">優先度 (高→低)</option>
          <option value="due-date">到期日 (近→遠)</option>

    <div class="space-y-3" id="taskListContainer">

      </div>
      <h3 class="text-base font-bold text-white mb-1">目前沒有任何待辦事項</h3>
      <p class="text-xs text-slate-400 max-w-sm">在上方表單輸入內容並按下新增，享受高效率、井然有序的待辦節奏！</p>
    </div>

  </main>

  <!-- Edit Task Modal -->

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">分類</label>

              <option value="study">📚 學習進修</option>
              <option value="personal">🏠 個人生活</option>
              <option value="finance">💳 財務理財</option>
              <option value="health">🏃 健康運動</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">優先程度</label>
            <select id="editTaskPriority" class="w-full glass-input text-slate-200 px-3 py-2 rounded-xl text-xs focus:outline-none">
              <option value="high">🔴 高 (High)</option>
              <option value="medium">🟡 中 (Medium)</option>
              <option value="low">🟢 低 (Low)</option>

          </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">到期日期與時間</label>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">

  <!-- Custom Confirmation Dialog (Replaces native confirm) -->
  <div id="confirmModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card bg-slate-900 max-w-sm w-full rounded-2xl p-5 border border-slate-700 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center text-2xl mx-auto mb-3">
        <i class="ph-bold ph-warning"></i>
      </div>
      <h4 class="text-base font-bold text-white mb-1" id="confirmTitle">確認動作</h4>
      <p class="text-xs text-slate-400 mb-5" id="confirmDesc">此操作執行後將無法復原，是否繼續？</p>
      <div class="flex justify-center gap-3">
        <button id="confirmCancelBtn" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 transition">取消</button>
        <button id="confirmProceedBtn" class="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-rose-600 hover:bg-rose-500 transition shadow-lg shadow-rose-600/30">確認清除</button>

  <!-- Toast Notification Box -->
  <div id="toastNotification" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm text-slate-200">

      <div id="toastMsg" class="font-medium text-xs">操作成功</div>
    </div>
  </div>

  <script>
    /* ============================================================
       1. STATE & CONSTANTS DEFINITION
       ============================================================ */
    const STORAGE_KEY = 'taskflow_pro_tasks_v2';

    const CATEGORY_MAP = {
      work: { label: '工作', icon: 'ph-briefcase', color: 'bg-blue-500/10 text-blue-400 border-blue-500/30' },
      study: { label: '學習', icon: 'ph-book-open', color: 'bg-purple-500/10 text-purple-400 border-purple-500/30' },
      personal: { label: '生活', icon: 'ph-house', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' },
      finance: { label: '財務', icon: 'ph-currency-dollar', color: 'bg-amber-500/10 text-amber-400 border-amber-500/30' },
      health: { label: '健康', icon: 'ph-heartbeat', color: 'bg-rose-500/10 text-rose-400 border-rose-500/30' }
    };

    const PRIORITY_MAP = {
      high: { label: '高', color: 'bg-rose-500/15 text-rose-400 border-rose-500/30' },
      medium: { label: '中', color: 'bg-amber-500/15 text-amber-400 border-amber-500/30' },
      low: { label: '低', color: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' }
    };

    let tasks = [];
    let currentFilter = 'all'; // 'all' | 'active' | 'completed'
    let currentCategoryFilter = 'all';
    let searchQuery = '';
    let currentSort = 'created-desc';

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Pleasant completion chime (E5 -> B5 arpeggio)
    function playCompleteSound() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const freqs = [659.25, 987.77]; // E5, B5
        freqs.forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.08);

          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.12, now + i * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.35);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.4);
        });
      } catch (err) {
        // Audio policy ignore
      }
    }

    // Soft click tone
    function playTapSound() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch (e) {}
    }

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          tasks = JSON.parse(saved);
        } else {
          // 移除所有預設範例任務，初始維持為空清單
          tasks = [];
          saveTasks();
        }
      } catch (e) {
        tasks = [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
      }
    }

    function formatDateDisplay() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      const str = now.toLocaleDateString('zh-TW', options);
      document.getElementById('currentDateDisplay').textContent = str;
    }

    function formatDueText(dateStr) {
      if (!dateStr) return null;
      const today = new Date();
      const due = new Date(dateStr);
      if (isNaN(due.getTime())) return null;

      const diffMs = due.getTime() - today.getTime();
      const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      
      const hours = String(due.getHours()).padStart(2, '0');
      const minutes = String(due.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${minutes}`;

      const isSameDate = today.getFullYear() === due.getFullYear() &&
                         today.getMonth() === due.getMonth() &&
                         today.getDate() === due.getDate();

      if (diffMs < 0) {
        const pastDays = Math.abs(diffDays);
        const text = pastDays <= 1 ? `已逾期 (${timeStr})` : `逾期 ${pastDays} 天`;
        return { text, isOverdue: true };
      } else if (isSameDate) {
        return { text: `今天 ${timeStr}`, isToday: true };
      } else if (diffDays === 1) {
        return { text: `明天 ${timeStr}`, isNear: true };
      } else {
        const month = due.getMonth() + 1;
        const day = due.getDate();
        return { text: `${month}/${day} ${timeStr}`, isNear: false };
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function getFilteredAndSortedTasks() {
      let result = [...tasks];

      // Filter by Status
      if (currentFilter === 'active') {
        result = result.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        result = result.filter(t => t.completed);
      }

      // Filter by Category
      if (currentCategoryFilter !== 'all') {
        result = result.filter(t => t.category === currentCategoryFilter);
      }

      // Search Query
      if (searchQuery.trim() !== '') {
        const q = searchQuery.toLowerCase().trim();
        result = result.filter(t => t.title.toLowerCase().includes(q));
      }

      // Sorting
      const priorityWeight = { high: 3, medium: 2, low: 1 };
      result.sort((a, b) => {
        if (currentSort === 'created-desc') return b.createdAt - a.createdAt;
        if (currentSort === 'created-asc') return a.createdAt - b.createdAt;
        if (currentSort === 'priority-desc') return priorityWeight[b.priority] - priorityWeight[a.priority];
        if (currentSort === 'due-date') {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return new Date(a.dueDate) - new Date(b.dueDate);
        }
        return 0;
      });

      return result;
    }

    function updateStats() {
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      const active = total - done;
      const percent = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('statDoneCount').textContent = done;
      document.getElementById('statTotalCount').textContent = total;
      document.getElementById('statPercent').textContent = `${percent}%`;
      document.getElementById('progressBarFill').style.width = `${percent}%`;

      // Update Filter counts
      document.getElementById('countFilterAll').textContent = total;
      document.getElementById('countFilterActive').textContent = active;
      document.getElementById('countFilterCompleted').textContent = done;

      // Motivational feedback
      const quoteEl = document.getElementById('productivityQuote');
      if (total === 0) {
        quoteEl.textContent = '展開全新的一天';
      } else if (percent === 100) {
        quoteEl.textContent = '🎉 全部完成！做得太棒了！';
      } else if (percent >= 70) {
        quoteEl.textContent = '🔥 即將全數攻克！衝刺前進！';
      } else if (percent >= 30) {
        quoteEl.textContent = '🚀 節奏流暢，保持專注！';
      } else {
        quoteEl.textContent = '維持專注，按部就班';
      }
    }

    function renderTasks() {
      const listContainer = document.getElementById('taskListContainer');
      const emptyState = document.getElementById('emptyState');
      const displayTasks = getFilteredAndSortedTasks();

      updateStats();
      listContainer.innerHTML = '';

      if (displayTasks.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      } else {
        emptyState.classList.remove('flex');
        emptyState.classList.add('hidden');
      }

      displayTasks.forEach(task => {
        const item = document.createElement('div');
        const isDone = task.completed;
        const catConfig = CATEGORY_MAP[task.category] || CATEGORY_MAP.personal;
        const priConfig = PRIORITY_MAP[task.priority] || PRIORITY_MAP.medium;
        const dueInfo = formatDueText(task.dueDate);

        item.className = `glass-card p-4 rounded-2xl flex items-center justify-between gap-3 transition-all duration-200 border ${
          isDone ? 'border-slate-800/80 bg-slate-900/40 opacity-60' : 'border-slate-800 hover:border-slate-700 bg-slate-900/80 shadow-md'
        }`;

        // Due badge html
        let dueHtml = '';
        if (dueInfo) {
          let dueBadgeColor = 'bg-slate-800 text-slate-400 border-slate-700';
          if (!isDone) {
            if (dueInfo.isOverdue) dueBadgeColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30 font-bold';
            else if (dueInfo.isToday) dueBadgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/30 font-semibold';
          }
          dueHtml = `
            <span class="text-[11px] px-2 py-0.5 rounded-lg border flex items-center gap-1 ${dueBadgeColor}">
              <i class="ph ph-calendar"></i>
              <span>${dueInfo.text}</span>
            </span>
          `;
        }

        item.innerHTML = `
          <!-- Checkbox and Title -->
          <div class="flex items-center gap-3.5 flex-1 min-w-0">
            <button 
              type="button" 
              class="toggle-check-btn w-6 h-6 rounded-lg flex items-center justify-center transition-all flex-shrink-0 ${
                isDone 
                  ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-600/50 check-animated' 
                  : 'border-2 border-slate-600 hover:border-indigo-400 text-transparent'
              }"
              title="${isDone ? '標記為未完成' : '標記為已完成'}"
            >
              <i class="ph-bold ph-check text-xs"></i>
            </button>

            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate ${isDone ? 'line-through text-slate-400' : 'text-slate-100'}">
                ${escapeHTML(task.title)}
              </p>

              <!-- Tags / Meta Info -->
              <div class="flex flex-wrap items-center gap-2 mt-1.5">
                <span class="text-[11px] px-2 py-0.5 rounded-lg border font-medium flex items-center gap-1 ${catConfig.color}">
                  <i class="ph ${catConfig.icon}"></i>
                  <span>${catConfig.label}</span>
                </span>

                <span class="text-[11px] px-2 py-0.5 rounded-lg border font-medium ${priConfig.color}">
                  優先度: ${priConfig.label}
                </span>

                ${dueHtml}
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center gap-1 flex-shrink-0">
            <button class="edit-task-btn p-2 rounded-xl text-slate-400 hover:text-indigo-400 hover:bg-slate-800 transition" title="編輯事項">
              <i class="ph-bold ph-pencil-simple text-base"></i>
            </button>
            <button class="delete-task-btn p-2 rounded-xl text-slate-400 hover:text-rose-400 hover:bg-slate-800 transition" title="刪除事項">
              <i class="ph-bold ph-trash text-base"></i>
            </button>
          </div>
        `;

        // Event: Toggle Done Status
        item.querySelector('.toggle-check-btn').addEventListener('click', () => {
          task.completed = !task.completed;
          if (task.completed) {
            playCompleteSound();
            showToast('已完成待辦事項！太棒了！');
          } else {
            playTapSound();
          }
          saveTasks();
          renderTasks();
        });

        // Event: Open Edit Modal
        item.querySelector('.edit-task-btn').addEventListener('click', () => {
          openEditModal(task);
        });

        // Event: Delete Item
        item.querySelector('.delete-task-btn').addEventListener('click', () => {
          playTapSound();
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          renderTasks();
          showToast('已刪除待辦事項');
        });

        listContainer.appendChild(item);
      });
    }

    const taskForm = document.getElementById('taskForm');
    const taskTitleInput = document.getElementById('taskTitleInput');
    const taskCategorySelect = document.getElementById('taskCategorySelect');
    const taskPrioritySelect = document.getElementById('taskPrioritySelect');
    const taskDueDateInput = document.getElementById('taskDueDateInput');
    const dueDateContainer = document.getElementById('dueDateContainer');

    // 取得當前本地時間字串 (格式: YYYY-MM-DDTHH:mm) 用於限制過去時間
    function getMinDateTimeLocal() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offset).toISOString().slice(0, 16);
    }

    // 更新時間輸入框的最小可選時間，禁止選擇過去的時間
    function refreshMinDateTime() {
      const currentMin = getMinDateTimeLocal();
      if (taskDueDateInput) taskDueDateInput.min = currentMin;
      const editDueDate = document.getElementById('editTaskDueDate');
      if (editDueDate) editDueDate.min = currentMin;
    }

    // 點擊容器直接叫出日期時間選擇視窗
    if (dueDateContainer && taskDueDateInput) {
      dueDateContainer.addEventListener('click', (e) => {
        refreshMinDateTime();
        if (e.target !== taskDueDateInput) {
          try {
            if (typeof taskDueDateInput.showPicker === 'function') {
              taskDueDateInput.showPicker();
            } else {
              taskDueDateInput.focus();
            }
          } catch (err) {
            taskDueDateInput.focus();
          }
        }
      });
      taskDueDateInput.addEventListener('focus', refreshMinDateTime);
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = taskTitleInput.value.trim();
      if (!title) return;

      const dueDateValue = taskDueDateInput.value || '';

      // 防呆驗證：不可設定過去的時間
      if (dueDateValue && new Date(dueDateValue) < new Date()) {
        showToast('⚠️ 到期時間不能早於當前時間，請重新選擇！');
        taskDueDateInput.focus();
        return;
      }

      const newTask = {
        id: 'task_' + Date.now(),
        title: title,
        category: taskCategorySelect.value,
        priority: taskPrioritySelect.value,
        dueDate: dueDateValue,
        completed: false,
        createdAt: Date.now()
      };

      tasks.unshift(newTask);
      saveTasks();
      renderTasks();
      playTapSound();
      showToast('已新增待辦事項');

      // Reset main input only, preserving preferred category/priority
      taskTitleInput.value = '';
      taskDueDateInput.value = '';
      taskTitleInput.focus();
    });

    const editModal = document.getElementById('editModal');
    const editTaskForm = document.getElementById('editTaskForm');
    const editTaskId = document.getElementById('editTaskId');
    const editTaskTitle = document.getElementById('editTaskTitle');
    const editTaskCategory = document.getElementById('editTaskCategory');
    const editTaskPriority = document.getElementById('editTaskPriority');
    const editTaskDueDate = document.getElementById('editTaskDueDate');

    function openEditModal(task) {
      refreshMinDateTime();
      editTaskId.value = task.id;
      editTaskTitle.value = task.title;
      editTaskCategory.value = task.category;
      editTaskPriority.value = task.priority;
      editTaskDueDate.value = task.dueDate || '';
      editModal.classList.remove('hidden');
      editTaskTitle.focus();
    }

    function closeEditModal() {
      editModal.classList.add('hidden');
    }

    document.getElementById('closeEditModalBtn').addEventListener('click', closeEditModal);
    document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);

    editTaskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = editTaskId.value;
      const target = tasks.find(t => t.id === id);
      if (target) {
        const editDueDateVal = editTaskDueDate.value || '';

        // 編輯防呆驗證：若修改了時間，不可設定為過去的時間
        if (editDueDateVal && new Date(editDueDateVal) < new Date()) {
          showToast('⚠️ 到期時間不能早於當前時間，請重新選擇！');
          editTaskDueDate.focus();
          return;
        }

        target.title = editTaskTitle.value.trim();
        target.category = editTaskCategory.value;
        target.priority = editTaskPriority.value;
        target.dueDate = editDueDateVal;
        saveTasks();
        renderTasks();
        closeEditModal();
        showToast('已更新事項內容');
      }
    });

    const confirmModal = document.getElementById('confirmModal');
    const confirmCancelBtn = document.getElementById('confirmCancelBtn');
    const confirmProceedBtn = document.getElementById('confirmProceedBtn');
    let confirmCallback = null;

    function openConfirmDialog(title, desc, onConfirm) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmDesc').textContent = desc;
      confirmCallback = onConfirm;
      confirmModal.classList.remove('hidden');
    }

    confirmCancelBtn.addEventListener('click', () => {
      confirmModal.classList.add('hidden');
      confirmCallback = null;
    });

    confirmProceedBtn.addEventListener('click', () => {
      confirmModal.classList.add('hidden');
      if (confirmCallback) confirmCallback();
      confirmCallback = null;
    });

    // Clear completed tasks button
    document.getElementById('clearCompletedBtn').addEventListener('click', () => {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) {
        showToast('目前沒有已完成的事項');
        return;
      }

      openConfirmDialog(
        '清理已完成事項',
        `確定要永久移除全部 ${completedCount} 個已完成的待辦事項嗎？`,
        () => {
          tasks = tasks.filter(t => !t.completed);
          saveTasks();
          renderTasks();
          showToast(`已清理 ${completedCount} 個完成項目`);
        }
      );
    });

    // Clear all tasks button (一鍵清空所有待辦事項)
    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (tasks.length === 0) {
        showToast('目前清單已經是空的');
        return;
      }

      openConfirmDialog(
        '清空全部事項',
        `確定要清空清單中全部 ${tasks.length} 個待辦事項嗎？`,
        () => {
          tasks = [];
          saveTasks();
          renderTasks();
          showToast('已清空所有待辦事項');
        }
      );
    });

    // Overview Stats Quick Toast
    document.getElementById('quickStatsBtn').addEventListener('click', () => {
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      const highPending = tasks.filter(t => !t.completed && t.priority === 'high').length;
      showToast(`總計 ${total} 項 | 完成 ${done} 項 | 高優先待辦 ${highPending} 項`);
    });

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(btn => {
          btn.className = 'filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all';
        });
        tab.className = 'filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all bg-indigo-600 text-white shadow-sm';
        currentFilter = tab.dataset.filter;
        renderTasks();
      });
    });

    // Search query input listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTasks();
    });

    // Category filter dropdown listener
    document.getElementById('filterCategoryDropdown').addEventListener('change', (e) => {
      currentCategoryFilter = e.target.value;
      renderTasks();
    });

    // Sort order dropdown listener
    document.getElementById('sortByDropdown').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderTasks();
    });

    // Toast utility helper
    const toast = document.getElementById('toastNotification');
    const toastMsg = document.getElementById('toastMsg');
    let toastTimer = null;

    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // Keyboard Shortcuts (Press '/' to search, 'Escape' to close modal)
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      } else if (e.key === 'Escape') {
        closeEditModal();
        confirmModal.classList.add('hidden');
      }
    });

    formatDateDisplay();
    refreshMinDateTime();
    loadTasks();
    renderTasks();
  </script>
</body>
</html>
